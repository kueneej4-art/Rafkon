<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>РАФКОН · Расчёт окон</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

  :root{
    --ink:#2B211C;
    --ink-soft:#8A7A6D;
    --line:#E4D8CB;
    --line-soft:#EFE6DB;
    --bg:#F6F0E8;
    --surface:#FFFFFF;
    --accent:#C1793F;
    --accent-ink:#6B3B14;
    --accent-soft:#F3E3CE;
    --danger:#C6492F;
    --radius:10px;
    font-family:'Manrope',system-ui,sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1E7DC;
      --ink-soft:#C2AE9C;
      --line:#4B3B2E;
      --line-soft:#392C22;
      --bg:#1C1611;
      --surface:#251D17;
      --accent:#E0985A;
      --accent-ink:#FCE7CE;
      --accent-soft:#3A2A1C;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1E7DC; --ink-soft:#C2AE9C; --line:#4B3B2E; --line-soft:#392C22;
    --bg:#1C1611; --surface:#251D17; --accent:#E0985A; --accent-ink:#FCE7CE; --accent-soft:#3A2A1C;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  }

  /* header */
  .top{ padding-top:env(safe-area-inset-top,0px); }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .brand-left{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:40px; height:40px; border-radius:9px; background:var(--surface);
    border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex:0 0 auto;
  }
  .brand-mark img{ width:88%; height:88%; object-fit:contain; }
  .brand-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:15.5px; letter-spacing:0.01em; color:var(--ink); line-height:1.15;
  }
  .brand-sub{ font-size:11.5px; color:var(--ink-soft); }

  .ticks{ display:flex; gap:5px; margin-bottom:22px; }
  .tick{ flex:1; height:3px; border-radius:2px; background:var(--line); transition:background .25s; }
  .tick.done{ background:var(--accent); }

  .step-label{
    font-size:13px; color:var(--ink-soft); margin-bottom:4px;
  }
  h1.q{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:23px;
    line-height:1.28;
    margin:0 0 18px 0;
    color:var(--ink);
    max-width:26ch;
  }

  main{ flex:1; }

  /* option grid */
  .opts{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s, background .15s;
    color:var(--ink);
    font-family:inherit;
  }
  .opt:active{ transform:scale(0.99); }
  .opt.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .opt-main{ display:flex; flex-direction:column; gap:2px; }
  .opt-title{ font-weight:700; font-size:15px; }
  .opt-desc{ font-size:12.5px; color:var(--ink-soft); }
  .opt-price{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px; color:var(--ink-soft); white-space:nowrap; margin-left:12px;
  }
  .opt.selected .opt-price{ color:var(--accent-ink); }
  .check{
    width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line);
    flex:0 0 auto; margin-left:10px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface);
  }
  .opt.selected .check{ background:var(--accent); border-color:var(--accent); }
  .check svg{ display:none; width:12px; height:12px; }
  .opt.selected .check svg{ display:block; }

  /* number/size inputs */
  .dims{ display:flex; gap:10px; }
  .field{ flex:1; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .field input{
    width:100%; padding:13px 12px; border-radius:var(--radius); border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:17px; font-family:'Space Grotesk',sans-serif;
    outline:none;
  }
  .field input:focus{ border-color:var(--accent); }
  .presets{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .preset{
    border:1.5px solid var(--line-soft); background:var(--surface); color:var(--ink-soft);
    border-radius:20px; padding:7px 13px; font-size:12.5px; cursor:pointer; font-family:inherit;
  }
  .preset:active{ border-color:var(--accent); color:var(--accent-ink); }

  .stepper-row{ display:flex; align-items:center; gap:14px; justify-content:center; margin-top:6px; }
  .stepper-btn{
    width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface);
    font-size:20px; color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .stepper-val{ font-family:'Space Grotesk',sans-serif; font-size:26px; min-width:40px; text-align:center; }

  .hint{ font-size:12.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5; }

  /* contact fields */
  .cfield{ margin-bottom:12px; }
  .cfield label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .cfield input{
    width:100%; padding:13px 12px; border-radius:var(--radius); border:1.5px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:15px; font-family:inherit; outline:none;
  }
  .cfield input:focus{ border-color:var(--accent); }

  /* result */
  .result-card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:16px;
  }
  .result-label{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
  .result-price{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; color:var(--accent-ink);
    letter-spacing:-0.01em;
  }
  .result-range{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }
  .breakdown{ margin-top:16px; border-top:1px solid var(--line-soft); padding-top:12px; }
  .brow{ display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--ink-soft); }
  .brow b{ color:var(--ink); font-weight:600; }
  .brow.total{ border-top:1px solid var(--line-soft); margin-top:6px; padding-top:10px; font-size:14.5px; }
  .brow.total b{ font-family:'Space Grotesk',sans-serif; }

  /* nav buttons */
  .nav{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1; padding:15px 18px; border-radius:var(--radius); border:none; font-size:15.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:disabled{ background:var(--line); color:var(--ink-soft); cursor:not-allowed; }
  .btn-ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink); flex:0 0 auto; width:52px; }
  .btn-secondary{ background:var(--accent-soft); color:var(--accent-ink); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .sent-screen{ text-align:center; padding:40px 10px; }
  .sent-icon{ font-size:44px; margin-bottom:16px; }
  .sent-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px; margin-bottom:8px; }
  .sent-sub{ font-size:14px; color:var(--ink-soft); line-height:1.5; }

</style>
</head>

<script>
(function(){

  /* ---------- price configuration — легко менять под свой прайс ---------- */
  var PRICING = {
    basePricePerM2: 5500,        // цена м² в базовой конфигурации (эконом-профиль, однокамерный стеклопакет)
    minArea: 1.0,                // минимальная площадь для расчёта окна, м²
    sashExtraPrice: 3000,        // доплата за каждую створку сверх первой
    profiles: [
      { id:'econom',   title:'Эконом',  desc:'3-камерный ПВХ-профиль', mult:1.00 },
      { id:'standard', title:'Стандарт', desc:'5-камерный ПВХ-профиль', mult:1.25 },
      { id:'premium',  title:'Премиум', desc:'7-камерный, энергосберегающий', mult:1.55 }
    ],
    glass: [
      { id:'single',  title:'Однокамерный', desc:'1 стекло + 1 камера', mult:1.00 },
      { id:'double',  title:'Двухкамерный', desc:'Стандарт для жилых помещений', mult:1.18 },
      { id:'doubleE', title:'Двухкамерный, энергосберегающий', desc:'С низкоэмиссионным напылением', mult:1.35 },
      { id:'triple',  title:'Трёхкамерный', desc:'Максимальная теплоизоляция', mult:1.55 }
    ],
    opening: [
      { id:'fixed',    title:'Глухое', desc:'Без открывания', mult:0.85 },
      { id:'turn',     title:'Поворотное', desc:'Открывается в одну сторону', mult:1.00 },
      { id:'turnTilt', title:'Поворотно-откidное', desc:'Открывание + режим проветривания', mult:1.15 }
    ],
    options: [
      { id:'mosquito', title:'Москитная сетка', desc:'На каждое окно', price:1300 },
      { id:'sill',     title:'Отлив', desc:'Наружный водоотлив', price:900 },
      { id:'windowsill', title:'Подоконник', desc:'Внутренний, стандартная глубина', price:1600 },
      { id:'install',  title:'Монтаж и демонтаж', desc:'Установка и вывоз старого окна', percent:0.15 }
    ]
  };
  // опечатка "откidное" — исправим программно ниже на всякий случай
  PRICING.opening[2].title = 'Поворотно-откидное';

  var state = {
    step: 0,
    sashCount: 1,
    opening: 'turnTilt',
    width: 1300,
    height: 1400,
    profile: 'standard',
    glass: 'double',
    options: [],
    qty: 1,
    name: '',
    phone: ''
  };

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  function fmt(n){
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }

  function calc(){
    var areaRaw = (state.width/100) * (state.height/100);
    var area = Math.max(PRICING.minArea, areaRaw);
    var profile = PRICING.profiles.find(function(p){return p.id===state.profile;});
    var glass = PRICING.glass.find(function(g){return g.id===state.glass;});
    var opening = PRICING.opening.find(function(o){return o.id===state.opening;});

    var base = PRICING.basePricePerM2 * area * profile.mult * glass.mult * opening.mult;
    var extraSashes = Math.max(0, state.sashCount - 1) * PRICING.sashExtraPrice;
    var windowBase = base + extraSashes;

    var fixedOptions = 0, installCost = 0;
    var optionLines = [];
    state.options.forEach(function(id){
      var o = PRICING.options.find(function(x){return x.id===id;});
      if (!o) return;
      if (o.percent){
        installCost = windowBase * o.percent;
        optionLines.push({ title:o.title, price: installCost });
      } else {
        fixedOptions += o.price;
        optionLines.push({ title:o.title, price: o.price });
      }
    });

    var perWindow = windowBase + fixedOptions + installCost;
    var total = perWindow * state.qty;

    return {
      area: area, profile: profile, glass: glass, opening: opening,
      windowBase: windowBase, extraSashes: extraSashes, optionLines: optionLines,
      perWindow: perWindow, total: total
    };
  }

  /* ---------- steps ---------- */
  var STEPS = ['sash','opening','size','profile','glass','options','qty','contact','result'];

  function renderTicks(){
    var wrap = document.getElementById('ticks');
    wrap.innerHTML = '';
    var n = STEPS.length - 1; // не считаем result отдельным делением
    for (var i=0;i<n;i++){
      var d = document.createElement('div');
      d.className = 'tick' + (i <= state.step ? ' done' : '');
      wrap.appendChild(d);
    }
    document.getElementById('stepCounter').textContent = (state.step < n) ? (state.step+1) + ' / ' + n : '';
  }

  function optionCard(opts){
    // opts: {selected, title, desc, priceText, onClick, multi}
    var el = document.createElement('div');
    el.className = 'opt' + (opts.selected ? ' selected' : '');
    el.innerHTML =
      '<div class="opt-main"><div class="opt-title">'+opts.title+'</div>' +
      (opts.desc ? '<div class="opt-desc">'+opts.desc+'</div>' : '') + '</div>' +
      '<div style="display:flex;align-items:center;">' +
      (opts.priceText ? '<div class="opt-price">'+opts.priceText+'</div>' : '') +
      '<div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '</div>';
    el.addEventListener('click', opts.onClick);
    return el;
  }

  function nav(main, opts){
    // opts: {backDisabled, nextLabel, nextDisabled, onNext}
    var row = document.createElement('div');
    row.className = 'nav';
    if (state.step > 0){
      var back = document.createElement('button');
      back.className = 'btn btn-ghost';
      back.textContent = '←';
      back.addEventListener('click', function(){ state.step--; render(); });
      row.appendChild(back);
    }
    var next = document.createElement('button');
    next.className = 'btn btn-primary';
    next.textContent = opts.nextLabel || 'Далее';
    next.disabled = !!opts.nextDisabled;
    next.addEventListener('click', opts.onNext);
    row.appendChild(next);
    main.appendChild(row);
  }

  function render(){
    renderTicks();
    var main = document.getElementById('main');
    main.innerHTML = '';
    var key = STEPS[state.step];

    if (key === 'sash'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Сколько створок в окне?';
      main.appendChild(h);
      var grid = document.createElement('div'); grid.className='opts';
      [1,2,3,4].forEach(function(n){
        grid.appendChild(optionCard({
          selected: state.sashCount===n,
          title: n===4 ? '4 и больше' : n + (n===1?' створка':(n<5?' створки':' створок')),
          onClick: function(){ state.sashCount=n; render(); }
        }));
      });
      main.appendChild(grid);
      nav(main, { onNext: function(){ state.step++; render(); } });
    }

    else if (key === 'opening'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Как окно открывается?';
      main.appendChild(h);
      var grid = document.createElement('div'); grid.className='opts';
      PRICING.opening.forEach(function(o){
        grid.appendChild(optionCard({
          selected: state.opening===o.id, title:o.title, desc:o.desc,
          onClick: function(){ state.opening=o.id; render(); }
        }));
      });
      main.appendChild(grid);
      nav(main, { onNext: function(){ state.step++; render(); } });
    }

    else if (key === 'size'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Размеры окна';
      main.appendChild(h);
      var dims = document.createElement('div'); dims.className='dims';
      dims.innerHTML =
        '<div class="field"><label>Ширина, см</label><input type="number" id="wInput" value="'+state.width+'" min="30" max="500"></div>' +
        '<div class="field"><label>Высота, см</label><input type="number" id="hInput" value="'+state.height+'" min="30" max="500"></div>';
      main.appendChild(dims);
      var pres = document.createElement('div'); pres.className='presets';
      [['1300×1400 (стандарт)',1300,1400],['1500×1500 (кухня)',1500,1500],['2100×1400 (балкон)',2100,1400],['600×600 (туалет/ванная)',600,600]].forEach(function(p){
        var b = document.createElement('button'); b.className='preset'; b.textContent=p[0];
        b.addEventListener('click', function(){
          state.width=p[1]; state.height=p[2]; render();
        });
        pres.appendChild(b);
      });
      main.appendChild(pres);
      main.appendChild(Object.assign(document.createElement('div'), {className:'hint', textContent:'Не знаете точных размеров — укажите примерные, менеджер уточнит их при замере.'}));
      nav(main, { onNext: function(){
        state.width = Math.max(30, parseInt(document.getElementById('wInput').value)||state.width);
        state.height = Math.max(30, parseInt(document.getElementById('hInput').value)||state.height);
        state.step++; render();
      }});
    }

    else if (key === 'profile'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Профиль ПВХ';
      main.appendChild(h);
      var grid = document.createElement('div'); grid.className='opts';
      PRICING.profiles.forEach(function(p){
        grid.appendChild(optionCard({
          selected: state.profile===p.id, title:p.title, desc:p.desc,
          onClick: function(){ state.profile=p.id; render(); }
        }));
      });
      main.appendChild(grid);
      nav(main, { onNext: function(){ state.step++; render(); } });
    }

    else if (key === 'glass'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Стеклопакет';
      main.appendChild(h);
      var grid = document.createElement('div'); grid.className='opts';
      PRICING.glass.forEach(function(g){
        grid.appendChild(optionCard({
          selected: state.glass===g.id, title:g.title, desc:g.desc,
          onClick: function(){ state.glass=g.id; render(); }
        }));
      });
      main.appendChild(grid);
      nav(main, { onNext: function(){ state.step++; render(); } });
    }

    else if (key === 'options'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Дополнительно';
      main.appendChild(h);
      var grid = document.createElement('div'); grid.className='opts';
      PRICING.options.forEach(function(o){
        var priceText = o.percent ? '+'+Math.round(o.percent*100)+'%' : '+'+fmt(o.price)+' ₽';
        grid.appendChild(optionCard({
          selected: state.options.indexOf(o.id)>=0, title:o.title, desc:o.desc, priceText:priceText,
          onClick: function(){
            var i = state.options.indexOf(o.id);
            if (i>=0) state.options.splice(i,1); else state.options.push(o.id);
            render();
          }
        }));
      });
      main.appendChild(grid);
      nav(main, { onNext: function(){ state.step++; render(); } });
    }

    else if (key === 'qty'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Сколько таких окон нужно?';
      main.appendChild(h);
      var row = document.createElement('div'); row.className='stepper-row';
      var minus = document.createElement('button'); minus.className='stepper-btn'; minus.textContent='–';
      var val = document.createElement('div'); val.className='stepper-val'; val.textContent=state.qty;
      var plus = document.createElement('button'); plus.className='stepper-btn'; plus.textContent='+';
      minus.addEventListener('click', function(){ if(state.qty>1){state.qty--; val.textContent=state.qty;} });
      plus.addEventListener('click', function(){ if(state.qty<50){state.qty++; val.textContent=state.qty;} });
      row.appendChild(minus); row.appendChild(val); row.appendChild(plus);
      main.appendChild(row);
      main.appendChild(Object.assign(document.createElement('div'), {className:'hint', textContent:'Если окна отличаются размером или комплектацией — рассчитайте их по отдельности и сложите результаты.', style:'text-align:center'}));
      nav(main, { onNext: function(){ state.step++; render(); } });
    }

    else if (key === 'contact'){
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Куда отправить расчёт?';
      main.appendChild(h);
      var f1 = document.createElement('div'); f1.className='cfield';
      f1.innerHTML = '<label>Имя</label><input type="text" id="nameInput" placeholder="Как к вам обращаться" value="'+state.name+'">';
      var f2 = document.createElement('div'); f2.className='cfield';
      f2.innerHTML = '<label>Телефон</label><input type="tel" id="phoneInput" placeholder="+7 ___ ___ __ __" value="'+state.phone+'">';
      main.appendChild(f1); main.appendChild(f2);
      main.appendChild(Object.assign(document.createElement('div'), {className:'hint', textContent:'Нужно, чтобы менеджер мог связаться и уточнить точный замер и сроки.'}));
      nav(main, { nextLabel:'Показать расчёт', onNext: function(){
        state.name = document.getElementById('nameInput').value.trim();
        state.phone = document.getElementById('phoneInput').value.trim();
        state.step++; render();
      }});
    }

    else if (key === 'result'){
      var r = calc();
      var h = document.createElement('h1'); h.className='q';
      h.textContent = 'Ваш предварительный расчёт';
      main.appendChild(h);

      var card = document.createElement('div'); card.className='result-card';
      var low = Math.round(r.total*0.92/100)*100;
      var high = Math.round(r.total*1.08/100)*100;
      card.innerHTML =
        '<div class="result-label">Итого за '+state.qty+' '+(state.qty===1?'окно':'окна(-он)')+'</div>' +
        '<div class="result-price">'+fmt(r.total)+' ₽</div>' +
        '<div class="result-range">Диапазон: '+fmt(low)+' – '+fmt(high)+' ₽ — точная цена после замера</div>' +
        '<div class="breakdown" id="bd"></div>';
      main.appendChild(card);

      var bd = card.querySelector('#bd');
      function brow(label, val){
        var d = document.createElement('div'); d.className='brow';
        d.innerHTML = '<span>'+label+'</span><b>'+val+'</b>';
        bd.appendChild(d);
      }
      brow('Площадь окна', r.area.toFixed(2)+' м²');
      brow('Профиль', r.profile.title);
      brow('Стеклопакет', r.glass.title);
      brow('Открывание', r.opening.title);
      brow('Окно (база)', fmt(r.windowBase)+' ₽');
      r.optionLines.forEach(function(o){ brow(o.title, '+'+fmt(o.price)+' ₽'); });
      var totalRow = document.createElement('div'); totalRow.className='brow total';
      totalRow.innerHTML = '<span>Цена за 1 окно</span><b>'+fmt(r.perWindow)+' ₽</b>';
      bd.appendChild(totalRow);

      var sendBtn = document.createElement('button');
      sendBtn.className = 'btn btn-primary'; sendBtn.style.width='100%'; sendBtn.style.marginBottom='10px';
      sendBtn.textContent = tg ? 'Отправить заявку менеджеру' : 'Отправить заявку';
      sendBtn.addEventListener('click', function(){ sendLead(r); });
      main.appendChild(sendBtn);

      var backBtn = document.createElement('button');
      backBtn.className = 'btn btn-ghost'; backBtn.style.width='100%'; backBtn.textContent='← Изменить параметры';
      backBtn.addEventListener('click', function(){ state.step = STEPS.indexOf('sash'); render(); });
      main.appendChild(backBtn);
    }
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  function sendLead(r){
    var payload = {
      name: state.name, phone: state.phone,
      sashCount: state.sashCount, opening: r.opening.title,
      width: state.width, height: state.height,
      profile: r.profile.title, glass: r.glass.title,
      options: r.optionLines.map(function(o){return o.title;}),
      qty: state.qty, total: Math.round(r.total)
    };
    if (tg && typeof tg.sendData === 'function'){
      try{
        tg.sendData(JSON.stringify(payload));
        showSent();
        return;
      }catch(e){}
    }
    // fallback — работает вне Telegram (например, при просмотре ссылки в браузере)
    var text = 'Заявка на расчёт окна\\n' +
      'Имя: '+(state.name||'—')+'\\nТелефон: '+(state.phone||'—')+'\\n' +
      'Размер: '+state.width+'×'+state.height+' мм, створок: '+state.sashCount+'\\n' +
      'Профиль: '+r.profile.title+', стеклопакет: '+r.glass.title+'\\n' +
      'Количество: '+state.qty+'\\nИтого: '+fmt(r.total)+' ₽';
    if (navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        showToast('Расчёт скопирован — отправьте его нам в сообщении');
      }).catch(function(){ showToast('Не удалось скопировать автоматически'); });
    } else {
      showToast('Скопируйте расчёт вручную и отправьте нам');
    }
  }

  function showSent(){
    var main = document.getElementById('main');
    main.innerHTML = '';
    document.getElementById('ticks').innerHTML='';
    document.getElementById('stepCounter').textContent='';
    var wrap = document.createElement('div'); wrap.className='sent-screen';
    wrap.innerHTML =
      '<div class="sent-icon">🪟</div>' +
      '<div class="sent-title">Заявка отправлена</div>' +
      '<div class="sent-sub">Менеджер свяжется с вами по указанному телефону, чтобы уточнить детали и назначить замер.</div>';
    main.appendChild(wrap);
    setTimeout(function(){ if (tg) { try{ tg.close(); }catch(e){} } }, 1600);
  }

  render();
})();
</script>
</body>
</html>
